<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mención de Honor - Pasaste Nítido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="certificado">
    <!-- Esquinas decorativas -->
    <span class="esquina sup-izq"></span>
    <span class="esquina sup-der"></span>
    <span class="esquina inf-izq"></span>
    <span class="esquina inf-der"></span>

    <!-- Columna izquierda: escudo y medalla -->
    <aside class="columna-izq">
      <img class="escudo" src="img/escudo.jpg" alt="Escudo del Instituto Técnico Futuro Profesional">
      <img class="medalla" src="img/medalla.png" alt="Medalla República de Colombia">
    </aside>

    <!-- Contenido central -->
    <section class="contenido">
      <p class="etiqueta">Mención de Honor</p>
      <h1 class="instituto">INSTITUTO TÉCNICO<br>FUTURO PROFESIONAL</h1>

      <p class="felicitaciones">“Felicitaciones por tu gran esfuerzo durante todo el año 2026”</p>

      <h2 class="titulo-grande">CERTIFICAMOS QUE</h2>

      <div class="espacio-nombre" aria-label="Espacio para escribir el nombre del estudiante"></div>

      <h2 class="titulo-grande destacado">PASASTE NÍTIDO</h2>

      <p class="mensaje">Todos los que te apoyaron para lograrlo, tus padres, familiares y amigos merecen un abrazo</p>

      <p class="bendicion">DIOS TE BENDIGA</p>
    </section>

    <!-- Columna derecha vacía para mantener el texto centrado -->
    <div class="columna-der" aria-hidden="true"></div>
  </main>
</body>
</html>
